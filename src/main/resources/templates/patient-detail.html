<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        nav {
            margin-bottom: 25px;
        }

        nav a {
            margin-right: 15px;
        }

        .details {
            margin-bottom: 30px;
        }

        .details div {
            margin: 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f5f5f5;
        }

        .pagination {
            margin-top: 20px;
        }

        .pagination a {
            margin-right: 10px;
        }
    </style>
</head>

<body>

<nav>
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/patients}">Patients</a>
</nav>

<h1 th:text="${patient.givenName + ' ' + patient.familyName}">
    Patient
</h1>

<div class="details">

    <div>
        <strong>Status:</strong>
        <span th:text="${patient.status}"></span>
    </div>

    <div>
        <strong>Age:</strong>
        <span th:text="${patient.age != null ? patient.age : '-'}"></span>
    </div>

    <div>
        <strong>Date of birth:</strong>
        <span th:text="${patient.dateOfBirth != null ? patient.dateOfBirth : '-'}"></span>
    </div>

    <div>
        <strong>Gender:</strong>
        <span th:text="${patient.gender != null ? patient.gender : '-'}"></span>
    </div>

    <div>
        <strong>Hospital ID:</strong>
        <span th:text="${patient.hospitalId != null ? patient.hospitalId : '-'}"></span>
    </div>

    <div>
        <strong>NHS number:</strong>
        <span th:text="${patient.nhsNumber != null ? patient.nhsNumber : '-'}"></span>
    </div>

    <div>
        <strong>Invited:</strong>
        <span th:text="${patient.whenInvited}"></span>
    </div>

    <div>
        <strong>Registered:</strong>
        <span th:text="${patient.whenRegistered != null ? patient.whenRegistered : '-'}"></span>
    </div>

    <div>
        <strong>Discharged:</strong>
        <span th:text="${patient.whenDischarged != null ? patient.whenDischarged : '-'}"></span>
    </div>

</div>

<h2>Engagement by module</h2>

<table>
    <thead>
    <tr>
        <th>Module</th>
        <th>Number of actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="entry : ${patient.engagementByModule}">
        <td th:text="${entry.key}"></td>
        <td th:text="${entry.value}"></td>
    </tr>

    <tr th:if="${patient.engagementByModule.isEmpty()}">
        <td colspan="2">No recorded engagement</td>
    </tr>

    </tbody>
</table>

<h2>Actions</h2>

<table>
    <thead>
    <tr>
        <th>Recorded</th>
        <th>Module</th>
        <th>Activity</th>
        <th>Context</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="action : ${actions.content}">
        <td th:text="${action.whenRecorded}"></td>
        <td th:text="${action.moduleId}"></td>
        <td th:text="${action.activity}"></td>
        <td th:text="${action.context}"></td>
    </tr>

    <tr th:if="${actions.empty}">
        <td colspan="4">No actions recorded</td>
    </tr>

    </tbody>
</table>

<div class="pagination">

    <a th:if="${actions.hasPrevious()}"
       th:href="@{/patients/{id}(
            id=${patient.id},
            page=${actions.number - 1},
            size=${actions.size}
       )}">
        Previous
    </a>

    <span th:if="${actions.totalPages > 0}">
        Page
        <span th:text="${actions.number + 1}"></span>
        of
        <span th:text="${actions.totalPages}"></span>
    </span>

    <a th:if="${actions.hasNext()}"
       th:href="@{/patients/{id}(
            id=${patient.id},
            page=${actions.number + 1},
            size=${actions.size}
       )}">
        Next
    </a>

</div>

</body>
</html>
